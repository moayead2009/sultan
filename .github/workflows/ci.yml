name: CI

on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solutions_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solutions_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solutions_gate
      AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      USE_DATABASE_CONTENT: 'false'
      STORAGE_DRIVER: s3
      OBJECT_STORAGE_REGION: auto
      OBJECT_STORAGE_BUCKET: ci-media
      OBJECT_STORAGE_PUBLIC_URL: https://media.example.invalid
      MAIL_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - name: Clean install
        run: npm ci
      - name: High-severity dependency audit
        run: npm audit --audit-level=high
      - name: Prisma generate
        run: npm run db:generate
      - name: Fresh database migration
        run: npx prisma migrate reset --force --skip-seed
      - name: Seed
        run: npm run db:seed
      - name: Production environment preflight contract
        env:
          AUTH_SECRET: ci-production-secret-with-more-than-thirty-two-characters
          APP_URL: https://ci.example.invalid
          NEXTAUTH_URL: https://ci.example.invalid
          STORAGE_DRIVER: s3
          OBJECT_STORAGE_BUCKET: ci-media
          OBJECT_STORAGE_PUBLIC_URL: https://media.example.invalid
          MAIL_PROVIDER: none
        run: npm run ops:preflight
      - name: Backup and restore script syntax
        run: bash -n scripts/backup-db.sh scripts/restore-db.sh
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser E2E, accessibility and responsive matrix
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Production performance budgets
        shell: bash
        run: |
          npm run start > /tmp/solutions-gate-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..45}; do
            if curl --fail --silent http://localhost:3000/api/ready > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/solutions-gate-next.log
            exit 1
          fi
          curl --fail --silent http://localhost:3000/api/health > /dev/null
          npx playwright test --config=playwright.performance.config.ts
