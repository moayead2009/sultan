name: CI

on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solutions_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solutions_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solutions_gate
      AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      APP_URL: http://localhost:3000
      USE_DATABASE_CONTENT: 'false'
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Prisma generate
        run: npm run db:generate
      - name: Fresh database migration
        run: npx prisma migrate reset --force --skip-seed
      - name: Seed
        run: npm run db:seed
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Phase 1 tests
        run: npm test
      - name: Production build
        run: npm run build
