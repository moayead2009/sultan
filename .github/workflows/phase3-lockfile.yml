name: Regenerate patched lockfile

on:
  push:
    branches: ['feature/solutions-gate-full-implementation']
    paths:
      - 'package.json'
      - '.github/workflows/phase3-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/solutions-gate-full-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh patched package lock"
          git push origin HEAD:feature/solutions-gate-full-implementation
